name: Helm Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and push the chart to GHCR
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package chart --version "${VERSION#v}" --app-version "${VERSION#v}"
          helm push cm-test-"${VERSION#v}".tgz oci://ghcr.io/edmonddantes21/cm-test
